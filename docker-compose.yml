services:
  postgres:
    image: postgres:16-alpine
    container_name: otc-postgres
    environment:
      POSTGRES_USER: otc
      POSTGRES_PASSWORD: otc_password
      POSTGRES_DB: otc
    ports:
      - "5432:5432"
    volumes:
      - otc_postgres_data:/var/lib/postgresql/data

volumes:
  otc_postgres_data:




